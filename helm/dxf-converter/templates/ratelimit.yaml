{{- with .Values.heavyRateLimit }}
# Stricter per-visitor limit on the expensive anonymous routes (upload, convert),
# on top of the cluster-wide public limits on Traefik's pubsecure entrypoint.
# Keyed like those: depth 1 = the visitor Cloudflare appended to X-Forwarded-For.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $.Release.Name }}-heavy
spec:
  rateLimit:
    average: {{ .average }}
    period: {{ .period }}
    burst: {{ .burst }}
    sourceCriterion:
      ipStrategy:
        depth: 1
        ipv6Subnet: 64
---
# Same host as the main Ingress; Traefik prefers these longer path rules. No
# cert-manager or external-dns markers: the main Ingress owns the cert and DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-heavy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: pubsecure
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $.Release.Name }}-heavy@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ $.Values.ingress.host }}
      secretName: {{ $.Values.ingress.tlsSecretName }}
  rules:
    - host: {{ $.Values.ingress.host }}
      http:
        paths:
          {{- range list "/api/upload" "/api/convert/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  name: http
          {{- end }}
{{- end }}
